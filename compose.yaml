# Default `docker compose up` runs the Gemma pool (gemma-4-e2b).
# Optional pools: `docker compose --profile qwen3 --profile qwen25 --profile vision --profile embed up`.
# GPU: uncomment the `deploy` block on an inference service (needs the
# NVIDIA Container Toolkit; not available on Docker Desktop for Mac).

x-llama: &llama
  # Pinned: the floating :server tag can change server defaults (e.g. --jinja)
  # and tool-call parsing under us. See docs/LLAMA_SERVER.md before bumping.
  image: ghcr.io/ggml-org/llama.cpp:server-b11434
  volumes:
    - ./models:/models:ro
  networks:
    - locci-network
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s
  # deploy:
  #   resources:
  #     reservations:
  #       devices:
  #         - driver: nvidia
  #           count: 1
  #           capabilities: [gpu]

services:
  # 1. The Edge Gateway (public facing)
  krakend:
    image: krakend:2.13
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8080:8080" # exposed to clients
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    # locci-auth runs on the host (`wrangler dev`, 127.0.0.1:8787). host-gateway
    # reaches the host's loopback under both Colima and Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      locci-ai-gateway:
        condition: service_healthy
    networks:
      - locci-network

  # 2. The AI Router + Metering (Locci)
  locci-ai-gateway:
    build: ./locci-ai-gateway
    environment:
      UPSTREAM_URL: http://nginx:80
    ports:
      - "127.0.0.1:8081:8080" # internal debugging only; remove before scaling
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      nginx:
        condition: service_started
    networks:
      - locci-network

  # 3. The Load Balancer
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8082:80" # lets a host-run router (`just run`) reach the pools
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Only the default pool: the opt-in pools (qwen3, qwen25, vision, embed)
    # answer 502 through nginx's `resolve` until they are started.
    depends_on:
      llama-gemma-1:
        condition: service_healthy
    networks:
      - locci-network

  # 4a. Inference: Coder Pool, model id `qwen3-1.7b` (chat, code, tool calling; opt-in)
  # Qwen3 is a thinking model; --reasoning off keeps answers and tool calls in
  # `content` / `tool_calls` instead of `reasoning_content`. --jinja is the
  # default on this build, set explicitly because tool calling depends on it.
  # Off by default since Gemma took over as the default model; start it with
  # `just up-all` or `docker compose --profile qwen3 up -d --wait llama-coder-1`.
  # To scale, copy this service as llama-coder-2 and add it to coder_pool in
  # nginx/nginx.conf.
  llama-coder-1:
    <<: *llama
    profiles: ["qwen3"]
    # 32768 / 2 slots = 16384 tokens per request. The KV cache is stored as
    # q8_0 (needs flash attention), half the f16 default's 112 KiB per token, so
    # this takes the same ~1.75 GiB the 8192-per-request f16 setup did. Keep it
    # under the model's 40,960-token training context: past that, answers degrade.
    # --cache-ram caps llama-server's host-RAM prompt cache (default 8192 MiB,
    # more than this VM has): unbounded, it grew the node until the OOM killer
    # took it under tool-calling load.
    command: ["-m", "/models/${CODER_MODEL:-Qwen3-1.7B-Q4_K_M.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "${CODER_CTX:-32768}", "--cont-batching", "--parallel", "${CODER_PARALLEL:-2}", "--flash-attn", "on", "--cache-type-k", "${CODER_KV_TYPE:-q8_0}", "--cache-type-v", "${CODER_KV_TYPE:-q8_0}", "--jinja", "--reasoning", "${CODER_REASONING:-off}", "--cache-ram", "${CODER_CACHE_RAM:-1024}"]

  # 4b. Inference: Qwen2.5-Coder Pool, model id `qwen2.5-coder-1.5b` (opt-in)
  # Code generation only: this model cannot produce tool calls (docs/SLMS.md).
  # Off by default to leave memory for the default pool; start it with
  # `just up-all` or `docker compose --profile qwen25 up -d`.
  llama-qwen25-coder-1:
    <<: *llama
    profiles: ["qwen25"]
    command: ["-m", "/models/${QWEN25_CODER_MODEL:-qwen2.5-coder-1.5b-instruct-q4_k_m.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "--cont-batching", "--parallel", "${LLAMA_PARALLEL:-4}", "--cache-ram", "${QWEN25_CACHE_RAM:-512}"]

  # 4c. Inference: Gemma Pool, model id `gemma-4-e2b` (the default pool)
  # Gemma 4 E2B with its vision projector (--mmproj), so requests can carry
  # images as OpenAI `image_url` parts. Like Qwen3 it thinks by default,
  # so --reasoning off keeps tool calls in `tool_calls`. 65536 / 2 slots = 32768
  # tokens per request (8192 was too few for CLI agent sessions), q8_0 KV cache:
  # most layers attend over a 512-token window, so the larger context cost no
  # resident memory (2.9 GiB either way). Reading a long prompt is the cost:
  # ~50 tokens/s on 4 vCPUs (docs/SLMS.md).
  llama-gemma-1:
    <<: *llama
    command: ["-m", "/models/${GEMMA_MODEL:-gemma-4-E2B-it-Q4_K_M.gguf}", "--mmproj", "/models/${GEMMA_MMPROJ:-gemma-4-E2B-it-mmproj-F16.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "${GEMMA_CTX:-65536}", "--cont-batching", "--parallel", "${GEMMA_PARALLEL:-2}", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--jinja", "--reasoning", "${GEMMA_REASONING:-off}", "--cache-ram", "${GEMMA_CACHE_RAM:-512}"]

  # 5. Inference: Vision/OCR Pool (opt-in)
  # PaddleOCR-VL 1.6: send an image plus a task prompt (`OCR:`, `Table
  # Recognition:`, `Formula Recognition:`, `Chart Recognition:`, `Seal
  # Recognition:`). Greedy decoding per the model card.
  llama-vision-1:
    <<: *llama
    profiles: ["vision"]
    command: ["-m", "/models/${VISION_MODEL:-PaddleOCR-VL-1.6.gguf}", "--mmproj", "/models/${VISION_MMPROJ:-PaddleOCR-VL-1.6-mmproj.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "--parallel", "2", "--temp", "0"]

  # 6. Inference: Embeddings Pool (opt-in)
  llama-embed-1:
    <<: *llama
    profiles: ["embed"]
    command: ["-m", "/models/${EMBED_MODEL:-nomic-embed-text-v1.5.Q4_K_M.gguf}", "--host", "0.0.0.0", "--port", "8080", "--embedding", "-c", "2048"]

  # 7. Event streams: Ursula, for resumable web replies (opt-in)
  # The example API records each web chat reply here with
  # RESUMABLE_STREAMS=ursula, so a reload resumes it even after an API restart
  # or on another API instance. Ursula has no auth of its own, so its port is
  # deliberately not published: the only way in is KrakenD's /v1/streams
  # endpoints, which check the caller's token. Start it with `just ursula-up`.
  # The image ships no curl/wget, so there is no healthcheck to wait on.
  ursula:
    image: ghcr.io/tonbo-io/ursula:${URSULA_VERSION:-0.3.0}
    profiles: ["ursula"]
    command: ["--config", "/etc/ursula/ursula.toml", "--node-id", "1"]
    expose:
      - "4437"
    volumes:
      - ./ursula/single.toml:/etc/ursula/ursula.toml:ro
      - ursula-data:/var/lib/ursula
    environment:
      - RUSTLOG=${RUSTLOG:-log}
    restart: unless-stopped
    networks:
      - locci-network

networks:
  locci-network:
    name: locci-network
    driver: bridge

volumes:
  ursula-data:
