worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS. With `resolve` on each upstream server, nginx
    # starts even when a pool's containers are not running (optional
    # profiles), and picks them up once they appear. Absent pools return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Upstream Pools (the inference nodes) ---

    upstream coder_pool {
        zone coder_pool 64k;
        least_conn; # send to the node with the fewest active streams
        server llama-coder-1:8080 resolve;
        # Add nodes here (and in compose.yaml) to scale the pool.
    }

    upstream qwen25_coder_pool {
        zone qwen25_coder_pool 64k;
        least_conn;
        server llama-qwen25-coder-1:8080 resolve;
    }

    upstream vision_pool {
        zone vision_pool 64k;
        least_conn;
        server llama-vision-1:8080 resolve;
    }

    upstream embed_pool {
        zone embed_pool 64k;
        least_conn;
        server llama-embed-1:8080 resolve;
    }

    server {
        listen 80;

        # Request bodies can carry base64 images for the vision pool.
        client_max_body_size 32m;

        # --- CRITICAL: SSE & LLM Streaming Optimizations ---
        proxy_buffering off;            # do not buffer generated tokens
        proxy_cache off;
        proxy_set_header Connection ''; # required for HTTP/1.1 streaming
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Generation can take a while; prevent proxy timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # --- Routing based on Locci's path rewriting ---

        location /coder/ {
            rewrite ^/coder/(.*)$ /$1 break;
            proxy_pass http://coder_pool;
        }

        location /qwen25-coder/ {
            rewrite ^/qwen25-coder/(.*)$ /$1 break;
            proxy_pass http://qwen25_coder_pool;
        }

        location /vision/ {
            rewrite ^/vision/(.*)$ /$1 break;
            proxy_pass http://vision_pool;
        }

        location /embed/ {
            rewrite ^/embed/(.*)$ /$1 break;
            proxy_pass http://embed_pool;
        }

        # A pool with no reachable node (not started, or every node down) is
        # nginx's own 502/503/504. Answer it in the OpenAI error shape instead of
        # an HTML page. Errors a node itself returns pass through untouched,
        # since proxy_intercept_errors stays off.
        error_page 502 503 504 = @pool_unavailable;
        location @pool_unavailable {
            default_type application/json;
            return 502 '{"error":{"message":"Model pool unavailable","type":"upstream_error"}}';
        }

        # Healthcheck
        location = /health {
            default_type text/plain;
            return 200 'OK';
        }
    }
}
